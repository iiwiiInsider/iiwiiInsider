name: Refresh profile activity

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/update-profile.mjs
      - .github/workflows/profile-activity.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate profile activity graphics
        env:
          PROFILE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-profile.mjs

      - name: Commit updated graphics
        run: |
          git add assets/repo-dashboard.svg assets/commit-pulse.svg assets/btc-dashboard.svg assets/languages.svg
          if git diff --cached --quiet; then
            echo "Profile graphics are already up to date."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore: refresh profile activity"
            git push
          fi
